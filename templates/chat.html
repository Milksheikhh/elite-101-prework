<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: white;
            padding: 12px 24px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .nav-items {
            display: flex;
            gap: 24px;
            color: #666;
            font-size: 14px;
        }
        
        .chat-container {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            background: white;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 80px);
        }
        
        .messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .bot-avatar {
            background: #f0f0f0;
            color: #666;
        }
        
        .user-avatar {
            background: #007bff;
            color: white;
        }
        
        .message-content {
            background: #f8f9fa;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 70%;
            line-height: 1.4;
            color: #333;
            white-space: pre-line;
            word-wrap: break-word;
            border: 1px solid #e9ecef;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        .message.user .message-content {
            background: #007bff;
            color: white;
            border: 1px solid #007bff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        .input-container {
            padding: 16px 24px;
            border-top: 1px solid #e0e0e0;
            background: white;
        }
        
        .input-form {
            display: flex;
            gap: 12px;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            background: #f8f9fa;
        }
        
        .input-field:focus {
            border-color: #007bff;
            background: white;
        }
        
        .send-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        
        .send-btn:hover {
            background: #0056b3;
        }
        
        .order-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            justify-content: center;
        }
        
        .order-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            color: #495057;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            min-width: 80px;
            text-align: center;
        }
        
        .order-btn:hover {
            background: #e9ecef;
            border-color: #007bff;
            color: #007bff;
        }
        
        .order-btn:active {
            background: #007bff;
            border-color: #007bff;
            color: white;
        }
        
        .option-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            justify-content: center;
        }
        
        .option-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            color: #495057;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            min-width: 120px;
            text-align: center;
        }
        
        .option-btn:hover {
            background: #e9ecef;
            border-color: #007bff;
            color: #007bff;
        }
        
        .option-btn:active {
            background: #007bff;
            border-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="nav-items" style="width: 100%; justify-content: center;">
            <span>Customer Service</span>
        </div>
    </div>
    
    <div class="chat-container">
        <div class="messages" id="chatContainer">
            {% for message in chat_history %}
                <div class="message {{ 'user' if message.type == 'user' else 'bot' }}">
                    <div class="avatar {{ 'user-avatar' if message.type == 'user' else 'bot-avatar' }}">
                    </div>
                    <div class="message-content">{{ message.message }}</div>
                </div>
            {% endfor %}
        </div>
        
        <div class="input-container">
            {% if step == '3' %}
            <div class="option-buttons">
                <button type="button" class="option-btn" onclick="selectOption('1')">1. Return an item</button>
                <button type="button" class="option-btn" onclick="selectOption('2')">2. Exchange an item</button>
                <button type="button" class="option-btn" onclick="selectOption('3')">3. Check return policy</button>
            </div>
            {% endif %}
            <form method="POST" class="input-form">
                <input type="hidden" name="step" value="{{ step or '1' }}">
                <input type="hidden" name="customer_name" value="{{ customer_name or '' }}">
                <input type="hidden" name="order_id" value="{{ order_id or '' }}">
                <input type="text" name="user_input" class="input-field" placeholder="{% if step == '3' %}Click an option above{% else %}Type your message...{% endif %}" autocomplete="off" autofocus required {% if step == 'done' or step == '3' %}disabled{% endif %}>
                <button type="submit" class="send-btn" {% if step == 'done' or step == '3' %}disabled{% endif %}>Send</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
        
        const form = document.querySelector('.input-form');
        form.addEventListener('submit', function() {
            setTimeout(function() {
                document.querySelector('.input-field').focus();
            }, 100);
        });
        
        const observer = new MutationObserver(function() {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
        
        observer.observe(document.getElementById('chatContainer'), {
            childList: true,
            subtree: true
        });
        
        function selectOrderId(orderId) {
            const inputField = document.querySelector('.input-field');
            inputField.value = orderId;
            inputField.focus();
            
            // Add visual feedback when clicked
            const buttons = document.querySelectorAll('.order-btn');
            buttons.forEach(btn => btn.style.background = '#f8f9fa');
            buttons.forEach(btn => btn.style.color = '#495057');
            buttons.forEach(btn => btn.style.borderColor = '#e9ecef');
            
            const clickedButton = event.target;
            clickedButton.style.background = '#007bff';
            clickedButton.style.color = 'white';
            clickedButton.style.borderColor = '#007bff';
        }
        
        function selectOption(option) {
            const inputField = document.querySelector('.input-field');
            const form = document.querySelector('.input-form');
            
            // Temporarily enable the input field to set its value
            inputField.disabled = false;
            inputField.value = option;
            
            // Add visual feedback when clicked
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.style.background = '#f8f9fa');
            buttons.forEach(btn => btn.style.color = '#495057');
            buttons.forEach(btn => btn.style.borderColor = '#e9ecef');
            
            const clickedButton = event.target;
            clickedButton.style.background = '#007bff';
            clickedButton.style.color = 'white';
            clickedButton.style.borderColor = '#007bff';

            form.submit();
        }
    </script>
</body>
</html>
